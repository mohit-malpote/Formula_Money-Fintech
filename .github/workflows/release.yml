name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore google-services.json if secret exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Verify google-services.json exists
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "::error::android/app/google-services.json is missing! Please provide it in android/app/ or set GOOGLE_SERVICES_JSON secret."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          CLEAN_KEY=$(echo "$GEMINI_API_KEY" | tr -d '\r\n"' | sed "s/^'//;s/'$//" | xargs)
          if [ -n "$CLEAN_KEY" ]; then
            echo "API key detected in secrets. Building with API key..."
            flutter build apk --release --dart-define=API_KEY="$CLEAN_KEY" --dart-define=GEMINI_API_KEY="$CLEAN_KEY" --dart-define=GEMINI_MODEL="$GEMINI_MODEL"
          else
            echo "::warning::No GEMINI_API_KEY or API_KEY secret found! Building without API key."
            flutter build apk --release --dart-define=GEMINI_MODEL="$GEMINI_MODEL"
          fi

      - name: Prepare APK Asset
        run: cp build/app/outputs/flutter-apk/app-release.apk Formula-Money.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Formula-Money.apk
          name: Formula Money ${{ github.ref_name }}
          body: |
            ## Formula Money Release ${{ github.ref_name }} 💸

            ### What's New:
            - Upgraded AI model to Gemini 3.8 Flash (`gemini-3.8-flash`) for daily goal generation and financial coaching.
            - Added configurable `GEMINI_MODEL` environment define support.
            - Enhanced Gemini API key validation and empty-key diagnostics.

            📲 Download **Formula-Money.apk** below to install!
          draft: false
          prerelease: false
